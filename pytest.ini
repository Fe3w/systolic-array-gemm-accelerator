[pytest]
# cocotb test modules are named cocotb_*.py so pytest never collects them directly;
# tb/<block>/test_<block>.py launchers run them through tb/common/runner.py.
python_files = test_*.py
# `sysarray` lives in compiler/; shared testbench helpers are imported as tb.common.*
pythonpath = compiler .
addopts = -ra
